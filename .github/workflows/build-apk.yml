name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=""
          for candidate in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SM="$candidate"
              break
            fi
          done
          if [ -z "$SM" ]; then
            echo "sdkmanager not found under $SDK" >&2
            ls -la "$SDK" "$SDK/cmdline-tools" || true
            exit 1
          fi
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0"

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Unit tests and APKs
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease assembleDebug

      - name: Name APKs for download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ha-phone-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ha-phone-debug.apk
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ha-phone-apk
          path: dist/*.apk

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/ha-phone-release.apk
            dist/ha-phone-debug.apk
