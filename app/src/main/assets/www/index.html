<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#1c1c1c"/>
  <title>Home Assistant</title>
  <link rel="icon" href="/static/logo.svg"/>
  <link rel="stylesheet" href="/static/app.css"/>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-brand" id="brand">
        <img class="brand-mark" src="/static/logo.svg" alt=""/>
        <div>
          <div class="brand-title" id="brandTitle">Home Assistant</div>
          <div class="brand-sub" id="brandSub">ha-phone</div>
        </div>
      </div>
      <nav id="nav"></nav>
    </aside>
    <div id="scrim"></div>
    <main id="main">
      <header id="header">
        <button id="menuBtn" class="icon-btn" aria-label="Menu"></button>
        <h1 id="pageTitle">Overview</h1>
        <button id="headerAction" class="icon-btn" aria-label="Action"></button>
      </header>
      <div id="content"></div>
    </main>
  </div>
  <div id="dialog" class="hidden">
    <div class="dialog-card" id="dialogCard"></div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
