<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#111111"/>
  <title>ha-phone</title>
  <link rel="icon" href="/static/logo.svg"/>
  <link rel="stylesheet" href="/static/app.css?v=0.3.0"/>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-brand" id="brand">
        <img class="brand-mark" src="/static/logo.svg" alt=""/>
        <div>
          <div class="brand-title" id="brandTitle">ha-phone</div>
          <div class="brand-sub" id="brandSub">Local hub</div>
        </div>
      </div>
      <nav id="nav"></nav>
    </aside>
    <div id="scrim"></div>
    <main id="main">
      <header id="header">
        <button id="menuBtn" class="icon-btn" aria-label="Menu"></button>
        <h1 id="pageTitle">Overview</h1>
        <button id="headerAction" class="icon-btn" aria-label="Action"></button>
      </header>
      <div id="content"></div>
    </main>
  </div>
  <div id="dialog" class="hidden">
    <div class="dialog-card" id="dialogCard"></div>
  </div>
  <div id="pinGate" class="hidden">
    <div class="pin-card ha-card">
      <h2>LAN PIN</h2>
      <p class="muted">This hub requires a PIN from other devices on the network. The phone itself does not.</p>
      <input class="field" id="pinInput" type="password" placeholder="PIN"/>
      <div class="error hidden" id="pinError">Wrong PIN</div>
      <div class="row-actions"><button class="btn" id="pinSubmit">Unlock</button></div>
    </div>
  </div>
  <script src="/static/app.js?v=0.3.0"></script>
</body>
</html>
